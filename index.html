<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>潜入工作員</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* 作戦端末：上に作戦帯、中央に戦術図、下に操作盤。夜間作戦用の単一の暗色画面 */
:root{
  --bg:#0a0c09;
  --panel:#12150f;
  --line:#2a3024;
  --fg:#dcd8c2;
  --dim:#7f8370;
  --amber:#e2a23a;
  --red:#d9473b;
  --green:#93c06c;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body.touch{position:fixed;inset:0;width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}

header{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.op{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.op small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.op b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.04em;white-space:nowrap;color:var(--stage,var(--fg))}
header{border-bottom:2px solid var(--stage,var(--line))}
.obj{font-size:12px;line-height:1.4;color:var(--dim);min-width:0;overflow-wrap:anywhere}
.obj span{color:var(--amber)}
.obj.done span{color:var(--green)}
.stat{display:flex;align-items:center;gap:12px}
.statcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#timer{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.alert{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);letter-spacing:.1em}
.bar{width:72px;height:5px;background:#1e231a;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber)}
.bar i.hot{background:var(--red)}
#muteBtn{background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;white-space:nowrap}
#muteBtn.off{color:var(--dim)}
.stat{gap:8px}

#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#wrap{position:relative;line-height:0}
#map{display:block;border:1px solid var(--line)}
#wrap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:var(--statush,0px);pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35) 100%)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,12,9,.88);border:1px solid var(--line);color:var(--fg);font-size:13px;line-height:1.4;padding:6px 12px;white-space:normal;width:max-content;max-width:min(92%,30em);text-align:center;overflow-wrap:anywhere;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
#toast.on{opacity:1}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,8,5,.86);z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding-block:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--dim)}
.big{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,60px);line-height:1;letter-spacing:.04em;text-wrap:balance}
.big.red{color:var(--red)}
.big.green{color:var(--green)}
.card p{font-size:14px;line-height:1.8;color:#bdb9a4;max-width:36em}
.rule{height:1px;background:var(--line)}
.missions{display:flex;flex-direction:column;gap:8px}
.mbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;padding:12px 14px;cursor:pointer}
.mbtn:hover:not(:disabled),.mbtn:focus-visible{border-color:var(--amber);outline:none}
.mbtn:disabled{opacity:.4;cursor:not-allowed}
.mbtn .n{font-family:var(--mono);color:var(--amber);font-size:13px;letter-spacing:.1em}
.mbtn .t{font-weight:700;font-size:15px}
.mbtn .r{font-size:12px;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;background:var(--amber);color:#14110a;border:0;font:inherit;font-weight:700;font-size:15px;padding:12px 16px;cursor:pointer;letter-spacing:.08em}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.facts{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line)}
.facts div{flex:1 1 76px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.facts small{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.facts b{font-family:var(--mono);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-weight:400}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:#bdb9a4;align-items:center}
.sw{width:14px;height:14px;display:inline-block}

#pad{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--panel);border-top:1px solid var(--line);padding-block:12px calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#zone{flex:1;align-self:stretch;min-width:124px;min-height:132px;position:relative;touch-action:none}
#stick{position:absolute;left:58px;top:50%;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,#191d15 0 40%,#10130d 41%);pointer-events:none;opacity:.55;transition:opacity .15s}
#stick.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#2c3226;border:1px solid #4a5240}
/* 地図の下の帯：左に状況表示、右に全体地図。プレイ画面には重ならない */
#hud{display:flex;gap:6px;align-items:stretch;margin-top:6px;line-height:normal}
#miniWrap{flex:none;width:min(170px,42%);height:72px;position:relative;border:1px solid var(--line);background:#080a07}
#mini{position:absolute;inset:0;width:100%;height:100%;display:block}
.padr{flex:none;display:grid;grid-template-columns:repeat(2,minmax(72px,96px));gap:8px}
.pbtn{background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:14px;font-weight:700;padding:12px 10px;cursor:pointer;letter-spacing:.04em;touch-action:manipulation;line-height:1.2}
.pbtn small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);margin-top:2px}
.pbtn.on{border-color:var(--amber);color:var(--amber)}
.pbtn.fire{border-color:#5b3a2a}
.pbtn.fire:active,.pbtn.melee:active{background:#1d2118}
.pbtn.mute{color:var(--dim);font-size:12px}
#keys{display:none;justify-content:center;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim);border-top:1px solid var(--line);background:var(--panel);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#keys kbd{font-family:var(--mono);color:var(--fg);border:1px solid var(--line);padding:1px 6px;margin-right:4px}
body.desk #pad{display:none}
body.desk #keys{display:flex}
#wrap::before{content:"";position:absolute;left:0;right:0;top:0;bottom:var(--statush,0px);pointer-events:none;box-shadow:inset 0 0 0 0 rgba(217,71,59,0);transition:box-shadow .2s;z-index:1}
#wrap.seen::before{box-shadow:inset 0 0 26px 3px rgba(217,71,59,.5)}
#wrap.caught::before{box-shadow:inset 0 0 60px 12px rgba(217,71,59,.9)}
#status{flex:1;min-width:0;display:flex;align-items:center;font-size:12px;line-height:1.3;padding:4px 8px;background:var(--panel);border:1px solid var(--line);color:var(--dim);white-space:normal;overflow-wrap:anywhere;min-height:72px;box-sizing:border-box}
#status.safe{color:#a9bfff;border-color:#3a4670}
#status.warn{color:var(--amber);border-color:#6b5124}
#status.hot{color:#fff;background:var(--red);border-color:var(--red)}
.rules{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6;color:#bdb9a4;padding-left:1.3em;margin:0}
.rules b{color:var(--fg);font-weight:700}
.rules .r{color:var(--red)}
.pbtn.ready{border-color:var(--green);color:var(--green)}
#ending{position:fixed;inset:0;z-index:20;background:#050604;display:flex;flex-direction:column;overflow:hidden}
#endcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.endtxt{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;padding-block:calc(64px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));pointer-events:none}
.endtxt .eyebrow{color:#cdb68a;opacity:0;transition:opacity 1.6s}
.endbig{font-family:var(--display);font-weight:400;font-size:clamp(64px,19vw,180px);line-height:.95;letter-spacing:.06em;color:#f3ead2;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.6);opacity:0;transform:translateY(14px);transition:opacity 1.8s,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.endsub{font-size:15px;line-height:1.8;color:#d8cfb6;max-width:30em;opacity:0;transition:opacity 1.6s;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#ending.on .endbig,#ending.on .endtxt .eyebrow,#ending.on .endsub{opacity:1;transform:none}
.endnext{position:absolute;z-index:2;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(5,6,4,.6);border:1px solid #6b5a3a;color:#f3ead2;font:inherit;font-size:14px;padding:10px 16px;cursor:pointer;opacity:0;transition:opacity 1s;pointer-events:none;letter-spacing:.08em}
.endnext.on{opacity:1;pointer-events:auto}
.endnext:focus-visible{outline:2px solid #f3ead2;outline-offset:2px}
#endroll{position:relative;z-index:1;flex:1;overflow-y:auto;background:rgba(5,6,4,.9);display:grid;place-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rolltbl{width:100%;border-collapse:collapse;font-size:14px}
.rolltbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rolltbl td:first-child{font-family:var(--mono);color:var(--amber);width:3em}
.rolltbl td:nth-child(3){text-align:right;color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
.rolltbl td:last-child{text-align:right;font-family:var(--display);width:4.5em}
@media (prefers-reduced-motion:reduce){.endbig,.endsub,.endtxt .eyebrow{transition:none}}
@media (max-width:420px){header{grid-template-columns:1fr auto}.obj{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header>
    <div class="op"><small id="opcode">作戦 00</small><b id="opname">待機中</b></div>
    <div class="obj" id="obj">目標 <span>作戦を選択</span></div>
    <div class="stat">
      <div class="statcol">
        <div id="timer">00:00.0</div>
        <div class="alert">警戒<div class="bar"><i id="alertbar"></i></div></div>
      </div>
      <button id="muteBtn" type="button">音 入</button>
    </div>
  </header>
  <div id="stage">
    <div id="wrap"><canvas id="map"></canvas><div id="toast"></div><div id="hud"><div id="status">潜伏中</div><div id="miniWrap"><canvas id="mini"></canvas></div></div></div>
    <div id="overlay"></div>
  </div>
  <div id="pad">
    <div id="zone"><div id="stick"><div id="knob"></div></div></div>
    <div class="padr">
      <button class="pbtn fire" id="fireBtn" type="button">射撃<small id="ammoLbl">残弾 3</small></button>
      <button class="pbtn melee" id="meleeBtn" type="button"><span id="meleeName">絞め落とす</span><small id="meleeLbl">近づいて使う</small></button>
      <button class="pbtn" id="sneakBtn" type="button">忍び足<small id="sneakLbl">切</small></button>
      <button class="pbtn mute" id="pauseBtn" type="button">一時停止</button>
    </div>
  </div>
  <div id="ending" hidden>
    <canvas id="endcv"></canvas>
    <div class="endtxt" id="endtxt">
      <div class="eyebrow">全作戦終了</div>
      <div class="endbig">任務完了</div>
      <div class="endsub">夜が明けるころ、巨大戦車は演習場で燃え尽きていた。この夜の出来事は、どの記録にも残らない。工作員は誰にも知られることなく、次の任務へ向かう。</div>
    </div>
    <div id="endroll" hidden></div>
    <button class="endnext" id="endNext" type="button">作戦記録へ</button>
  </div>
  <div id="keys">
    <span><kbd>WASD</kbd>移動</span>
    <span><kbd>Shift</kbd>忍び足</span>
    <span><kbd>Space</kbd>絞め落とす</span>
    <span><kbd>F</kbd>射撃</span>
    <span><kbd>C</kbd>忍び足の切り替え</span>
    <span><kbd>M</kbd>音</span>
    <span><kbd>Esc</kbd>一時停止</span>
  </div>
</div>

}

function tone(type,m,t,dur,vol,cut,opt={}){
  const c=A.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=out(opt.dest,opt.send);

  const c=A.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=A.noise;s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q||1;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(A.amb);s.start(0,Math.random()*1.5);
  const ns=[s];
  if(lfo){// 風のうねり：音量と音色をゆっくり揺らす
    const o=c.createOscillator(),og=c.createGain();o.frequency.value=lfo.rate;og.gain.value=lfo.freq;o.connect(og);og.connect(f.frequency);
    const o2=c.createOscillator(),og2=c.createGain();o2.frequency.value=lfo.rate*.63;og2.gain.value=vol*.7;o2.connect(og2);og2.connect(g.gain);
    o.start();o2.start();ns.push(o,o2);}
  AMB.nodes.push(...ns);
}
function ambHum(freq,vol){const c=A.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.value=freq;f.type="lowpass";f.frequency.value=freq*3;g.gain.value=vol;o.connect(f);f.connect(g);g.connect(A.amb);o.start();AMB.nodes.push(o)}
function ambStart(kind){
  if(!A.ctx)return;ambStop(true);AMB.kind=kind;AMB.next=A.ctx.currentTime+.3;
  switch(kind){
    case "rain":ambLoop("bandpass",2400,.5,.16);ambLoop("highpass",5500,.7,.05);ambLoop("lowpass",420,.7,.09);break;
    case "snow":ambLoop("bandpass",520,1.6,.12,{rate:.11,freq:260});ambLoop("highpass",3500,.5,.012);break;
    case "dust2":ambLoop("bandpass",380,1.2,.08,{rate:.08,freq:160});break;
    case "drips":ambLoop("lowpass",180,.7,.06);break;
    case "embers":ambLoop("lowpass",320,.7,.07);break;
    case "flicker":ambHum(100,.02);ambHum(120,.012);ambLoop("lowpass",250,.7,.025);break;
    case "steam":ambLoop("lowpass",160,.7,.05);break;
    case "dust":ambLoop("lowpass",140,.7,.05);break;
    default:ambLoop("lowpass",200,.7,.03);break;
  }
  A.amb.gain.cancelScheduledValues(A.ctx.currentTime);A.amb.gain.setTargetAtTime(1,A.ctx.currentTime,.6);
}
function ambStop(now){
  if(!A.ctx)return;const t=A.ctx.currentTime;
  if(!now){A.amb.gain.setTargetAtTime(0,t,.3)}else A.amb.gain.setValueAtTime(0,t);
  const old=AMB.nodes;AMB.nodes=[];AMB.kind=null;
  for(const n of old){try{n.stop(t+(now?0:1.2))}catch(e){}}
}
// 雨粒や水滴、火のはぜる音などの単発の音
function ambTick(){
  if(!A.ctx||!AMB.kind||A.muted)return;const c=A.ctx;
  while(AMB.next<c.currentTime+.1){
    const t=AMB.next,k=AMB.kind;let gap=.5;
    if(k==="rain"){noise(t,.025,.03+Math.random()*.03,"highpass",4000+Math.random()*3000,{dest:A.amb,pan:Math.random()*2-1});gap=.03+Math.random()*.06;
      if(Math.random()<.004){noise(t,2.5,.18,"lowpass",160,{dest:A.amb,att:.4});}}
    else if(k==="snow"){if(Math.random()<.3)noise(t,.6,.02,"bandpass",1800,{dest:A.amb,att:.25,q:3});gap=.4+Math.random()*.6}
    else if(k==="drips"){pluck("sine",80+Math.floor(Math.random()*10),t,.4,.05+Math.random()*.03,6000,{dest:A.amb,send:.8});gap=.4+Math.random()*1.2}
    else if(k==="embers"){noise(t,.012,.05+Math.random()*.06,"bandpass",2500+Math.random()*3000,{dest:A.amb,q:4,pan:Math.random()*2-1});gap=.05+Math.random()*.25}
    else if(k==="steam"){if(Math.random()<.18){noise(t,1.8,.07,"highpass",3000,{dest:A.amb,att:.4})}gap=1+Math.random()*1.5}
    else if(k==="flicker"){if(Math.random()<.08)noise(t,.05,.03,"highpass",6000,{dest:A.amb});gap=.5}
    else gap=1;
    AMB.next+=gap;
  }
}
function aTick(){
  ambTick();
  if(!A.ctx||!A.song)return;
  const sp=60/A.song.bpm/4;
  while(A.next<A.ctx.currentTime+.12){
    const ten=A.ten;
    A.song.play(A.step,A.next,sp,ten);
    if(ten>.55&&A.step%4===0)pluck("square",86,A.next,.12,.03+.03*ten,3000);
    A.next+=sp;A.step++;
  }
}
let footSide=1;
function engineOn(){
  if(!A.ctx||A.engine)return;const c=A.ctx;
  const g=c.createGain();g.gain.value=0;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=170;
  const pn=c.createStereoPanner?c.createStereoPanner():null;
  const o1=c.createOscillator(),o2=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain();
  o1.type="sawtooth";o1.frequency.value=36;o2.type="square";o2.frequency.value=54.5;lfo.frequency.value=7;lg.gain.value=50;
  lfo.connect(lg);lg.connect(f.frequency);o1.connect(f);o2.connect(f);f.connect(g);
  if(pn){g.connect(pn);pn.connect(A.sfx)}else g.connect(A.sfx);
  o1.start();o2.start();lfo.start();A.engine={g,pn,os:[o1,o2,lfo]};
}
function engineOff(){if(!A.engine)return;const t=A.ctx.currentTime;A.engine.g.gain.setTargetAtTime(0,t,.08);A.engine.os.forEach(o=>o.stop(t+.5));A.engine=null}
function engineSet(v,pan){if(!A.engine)return;const t=A.ctx.currentTime;A.engine.g.gain.setTargetAtTime(v,t,.1);if(A.engine.pn)A.engine.pn.pan.setTargetAtTime(Math.max(-1,Math.min(1,pan)),t,.1)}
const SFX={
  cannon(){const t=A.ctx.currentTime;kick(t,.9,A.sfx,90,.6);noise(t,.7,.5,"lowpass",900,{dest:A.sfx});noise(t,.08,.3,"highpass",2000,{dest:A.sfx})},
  boom(v){v=v||1;const t=A.ctx.currentTime;kick(t,.9*v,A.sfx,70,.8);noise(t,1.0,.55*v,"lowpass",600,{dest:A.sfx});noise(t,.25,.3*v,"bandpass",1500,{dest:A.sfx})},
  hit(){const t=A.ctx.currentTime;noise(t,.2,.35,"lowpass",1200,{dest:A.sfx});pluck("sawtooth",50,t,.3,.2,800,{dest:A.sfx})},
  plant(){const t=A.ctx.currentTime;pluck("square",84,t,.08,.08,4000,{dest:A.sfx});pluck("square",91,t+.1,.08,.08,4000,{dest:A.sfx})},
  beep(){const t=A.ctx.currentTime;pluck("square",96,t,.05,.06,5000,{dest:A.sfx})},
  lock(){const t=A.ctx.currentTime;pluck("square",90,t,.05,.05,5000,{dest:A.sfx})},
  clang(){const t=A.ctx.currentTime;pluck("triangle",88,t,.25,.12,6000,{dest:A.sfx});noise(t,.06,.2,"highpass",5000,{dest:A.sfx})},
  // 通常の足音：靴底が床を打つ重い音と、砂利のこすれ
  step(){const t=A.ctx.currentTime;footSide=-footSide;const v=.9+Math.random()*.2;
    kick(t,.42*v,A.sfx,95+footSide*8,.11,footSide*.15);
    noise(t,.07,.2*v,"bandpass",1700+Math.random()*500,{dest:A.sfx,q:1.4,pan:footSide*.15});
    noise(t+.012,.04,.09*v,"highpass",4500,{dest:A.sfx,pan:footSide*.15})},
  // 忍び足：つま先で触れるだけの、かすれた小さな音
  sneakstep(){const t=A.ctx.currentTime;footSide=-footSide;
    noise(t,.06,.035,"lowpass",700,{dest:A.sfx,att:.025,pan:footSide*.1})},
  // 見張りの足音：距離で小さく、方向で左右に振る
  gstep(vol,pan){const t=A.ctx.currentTime;
    kick(t,.3*vol,A.sfx,80,.1,pan);noise(t,.06,.16*vol,"bandpass",1300,{dest:A.sfx,q:1.2,pan})},
  shot(){const t=A.ctx.currentTime;noise(t,.12,.5,"bandpass",900,{dest:A.sfx,q:.8});noise(t,.04,.3,"highpass",3000,{dest:A.sfx});kick(t,.25,A.sfx)},
  melee(){const t=A.ctx.currentTime;kick(t,.6,A.sfx);noise(t,.12,.25,"lowpass",500,{dest:A.sfx})},
  whiff(){const t=A.ctx.currentTime;noise(t,.12,.12,"bandpass",1400,{dest:A.sfx,att:.04,q:2})},
  empty(){const t=A.ctx.currentTime;pluck("square",96,t,.03,.08,4000,{dest:A.sfx})},
  pick(){const t=A.ctx.currentTime;pluck("triangle",81,t,.4,.12,4000,{dest:A.sfx});pluck("triangle",88,t+.09,.6,.12,4000,{dest:A.sfx})},
  notice(){const t=A.ctx.currentTime;pluck("triangle",76,t,.18,.13,4000,{dest:A.sfx});pluck("triangle",83,t+.08,.25,.13,4000,{dest:A.sfx})},
  alert(){const t=A.ctx.currentTime;[0,.09].forEach(o=>{pluck("sawtooth",79,t+o,.18,.16,3500,{dest:A.sfx});pluck("sawtooth",80,t+o,.18,.16,3500,{dest:A.sfx})})},
  siren(){const t=A.ctx.currentTime;noise(t,.25,.35,"bandpass",1200,{dest:A.sfx});kick(t,.7,A.sfx);
    pluck("sawtooth",86,t,.3,.2,5000,{dest:A.sfx});pluck("sawtooth",87,t,.3,.2,5000,{dest:A.sfx});
    for(let i=0;i<6;i++)tone("square",i%2?76:81,t+.12+i*.16,.16,.09,2600,{dest:A.sfx,rel:.02})},
  cam(){const t=A.ctx.currentTime;pluck("square",88,t,.08,.06,4000,{dest:A.sfx});pluck("square",88,t+.12,.08,.06,4000,{dest:A.sfx})},
  spark(){const t=A.ctx.currentTime;noise(t,.08,.15,"highpass",4000,{dest:A.sfx})},
  fail(){const t=A.ctx.currentTime;tone("sawtooth",38,t,1.6,.2,600,{dest:A.sfx,glide:26,rel:.6});noise(t,1.2,.15,"lowpass",300,{dest:A.sfx})},
  win(){const t=A.ctx.currentTime;[62,66,69,74,78].forEach((m,i)=>pluck("triangle",m,t+i*.11,1.6,.1,3000,{dest:A.sfx,send:.5}));tone("sine",50,t,2,.15,300,{dest:A.sfx,att:.1,rel:1})}

function sfx(n,...a){if(A.ctx&&!A.muted&&SFX[n])SFX[n](...a)}
function setMute(m){
  A.muted=m;try{localStorage.setItem("munon-mute",m?"1":"0")}catch(e){}
  if(A.ctx)A.master.gain.setTargetAtTime(m?0:.9,A.ctx.currentTime,.05);

const ITEMS={doc:{n:"書類",u:"通"},floppy:{n:"フロッピー",u:"枚"},film:{n:"マイクロフィルム",u:"本"},vial:{n:"試料の小瓶",u:"本"},key:{n:"鍵",u:"本"},card:{n:"暗号カード",u:"枚"},tape:{n:"記録テープ",u:"本"},tube:{n:"設計図の筒",u:"本"}};
let itemAt={},got=0,need=0;
let L,grid,player,guards,cams,bullets,sparks,ripples=[],intelTaken,time,maxAlert,kos,shots,levelIdx=0,mode="title",tile=20,dpr=1,layer,lastCall=0,toastT=0,clock=0,alarmOn=false;

function cell(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return "#";return grid[ty][tx]}
function solidAt(x,y){const c=cell(Math.floor(x),Math.floor(y));return c==="#"||c==="C"}
function darkAt(x,y){return cell(Math.floor(x),Math.floor(y))==="D"}
function los(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/0.1);
  for(let i=1;i<n;i++){const t=i/n;if(solidAt(x0+(x1-x0)*t,y0+(y1-y0)*t))return false}
  return true;
}
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return [];
  const prev=new Int32Array(W*H).fill(-1),q=[sy*W+sx];prev[sy*W+sx]=sy*W+sx;
  const goal=ty*W+tx;
  for(let h=0;h<q.length;h++){
    const c=q[h];if(c===goal)break;
    const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy,n=ny*W+nx;
      if(nx<0||ny<0||nx>=W||ny>=H||prev[n]!==-1)continue;
      const ch=grid[ny][nx];if(ch==="#"||ch==="C")continue;
      prev[n]=c;q.push(n);
    }
  }
  if(prev[goal]===-1)return [];
  const path=[];let c=goal;
  while(c!==sy*W+sx){path.push([c%W+.5,((c/W)|0)+.5]);c=prev[c]}
  return path.reverse();
}

function load(i){
  levelIdx=i;L=LEVELS[i];grid=L.map.map(r=>r.split(""));W=L.map[0].length;H=L.map.length;camSnap=true;TH=THEMES[i];FX.p=[];
  document.documentElement.style.setProperty("--stage",TH.accent);

  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==="S"){sx=x;sy=y;grid[y][x]="."}

      meter:0,speed:g.speed*(L.gspd||1),range:L.grange||6,half:.62,target:null,look:0,lookBase:0,heard:0,walk:0,moving:false,down:false,found:false};
  });
  cams=L.cams.map(c=>({...c,face:c.base,t:0,meter:0,range:6,half:.4,dead:false}));
  bullets=[];sparks=[];ripples=[];tank=null;shells=[];booms=[];charges=[];mgShots=[];mortars=[];shake=0;hitFlash=0;
  if(L.boss){
    const R=L.tank.route;
    tank={x:R[0][0],y:R[0][1],hull:0,tur:0,ri:1,dir:1,hp:3,mgAng:0,mgFace:Math.PI,mgCd:1.5,mgLock:0,mgSeen:false,mortT:3,resup:0,lock:0,cd:2,pause:.5,rage:false,noise:null,noiseT:0,seen:false,sweep:0,dead:false,deadT:0,booms:0,vx:0,vy:0,tread:0,beepT:0,smokeT:0,smoke:[]};
    player.hp=3;player.charges=0;player.inv=0;
  }
  itemAt={};got=0;need=0;
  {let k=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==="I"){itemAt[x+","+y]=(L.item&&L.item[k])||"doc";k++;need++}}
  intelTaken=need===0;time=0;maxAlert=0;lastCall=0;kos=0;shots=0;alarmOn=false;
  $("opcode").textContent=L.code;$("opname").textContent=L.name;
  setObj();syncAmmo();resize();
}
function itemLabel(){const ks=[...new Set(L.item||["doc"])];return ks.map(k=>ITEMS[k].n).join("と")}
function itemSummary(){const c={};for(const k of (L.item||[]))c[k]=(c[k]||0)+1;return Object.keys(c).map(k=>ITEMS[k].n+" "+c[k]+ITEMS[k].u).join("、")}
function setObj(){

}
function syncAmmo(){$("ammoLbl").textContent="残弾 "+(player?player.ammo:0)}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("on");toastT=2.6}

const keys={};let sneakLock=false;const stick={x:0,y:0,m:0};
addEventListener("keydown",e=>{
  if(e.repeat&&(e.code==="Space"||e.code==="KeyF"||e.code==="KeyE"||e.code==="KeyJ"))return;
  keys[e.code]=true;
  if(e.code==="KeyC"){sneakLock=!sneakLock;syncSneak()}
  if(e.code==="KeyM")setMute(!A.muted);
  if(e.code==="Space"||e.code==="KeyE")melee();
  if(e.code==="KeyF"||e.code==="KeyJ")shoot();
  if(mode==="ending"&&(e.code==="Enter"||e.code==="Space")&&$("endroll").hidden&&$("endNext").classList.contains("on")){e.preventDefault();showRoll();return}
  if(e.code==="Escape"||e.code==="KeyP"){if(mode==="play")pause();else if(mode==="pause")resume()}
  if(e.code.startsWith("Arrow")||e.code==="Space")e.preventDefault();
});
addEventListener("keyup",e=>{keys[e.code]=false});
// 焦点が外れた時はキーの押しっぱなしだけを解除する。一時停止は画面が隠れた時だけ
addEventListener("blur",()=>{for(const k in keys)keys[k]=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="play")pause()});

const zone=$("zone"),stickEl=$("stick"),knob=$("knob");let stickId=null,scx=0,scy=0;
function stickMove(e){
  const R=46;
  let dx=e.clientX-scx,dy=e.clientY-scy;
  const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  stick.x=dx/R;stick.y=dy/R;stick.m=Math.min(1,Math.hypot(stick.x,stick.y));
}
// iPhone では画面の下端を上に払うと閉じる操作になる。指が下端へ行かないよう、レバーは操作盤の中に収め、画面のスクロールも止める
for(const ev of ["touchstart","touchmove"])document.addEventListener(ev,e=>{if(mode==="play"&&e.target.closest&&!e.target.closest("button")&&(e.target.closest("#pad")||e.target.closest("#stage")))e.preventDefault()},{passive:false});
zone.addEventListener("pointerdown",e=>{
  if(stickId!==null)return;
  const r=zone.getBoundingClientRect();
  const lx=Math.max(58,Math.min(r.width-58,e.clientX-r.left)),ly=Math.max(58,Math.min(r.height-58,e.clientY-r.top));
  stickEl.style.left=lx+"px";stickEl.style.top=ly+"px";stickEl.classList.add("act");
  scx=r.left+lx;scy=r.top+ly;stickId=e.pointerId;zone.setPointerCapture(e.pointerId);stickMove(e)});
zone.addEventListener("pointermove",e=>{if(e.pointerId===stickId)stickMove(e)});
function stickEnd(e){if(e.pointerId!==stickId)return;stickId=null;stick.x=stick.y=stick.m=0;knob.style.transform="";stickEl.classList.remove("act");stickEl.style.left="";stickEl.style.top=""}

function alertNear(x,y,r,px,py){for(const g of guards)if(!g.down&&Math.hypot(g.x-x,g.y-y)<r){investigate(g,px,py);g.heard=1.2}}
function melee(){
  if(mode!=="play"||player.cd>0)return;
  if(L.boss){plant();return}
  player.cd=.45;player.act=.25;
  const tgt=meleeTarget();
  if(!tgt){sfx("whiff");toast("手の届く所に見張りがいない");return}
  player.face=Math.atan2(tgt.y-player.y,tgt.x-player.x);
  const behind=isBehind(tgt);
  if(!behind&&tgt.meter>.85){
    // 正面から気づかれている相手は振り払われる
    tgt.meter=Math.min(1,tgt.meter+.35);sfx("whiff");toast("正面からでは振りほどかれる");return;
  }
  // 相手の背中へ一気に詰める
  const back=tgt.face+Math.PI,bx=tgt.x+Math.cos(back)*.45,by=tgt.y+Math.sin(back)*.45;
  if(behind&&free(bx,by)){player.x=bx;player.y=by}
  downGuard(tgt);sfx("melee");
  if(!behind){alertNear(player.x,player.y,4,player.x,player.y);toast("物音を立ててしまった")}
  else toast("背後から絞め落とした");
}
function shoot(){
  if(mode!=="play"||player.cd>0)return;
  if(player.ammo<=0){sfx("empty");toast("弾切れ");player.cd=.3;return}
  const at=aimTarget();if(at)player.face=Math.atan2(at.y-player.y,at.x-player.x);
  player.ammo--;shots++;syncAmmo();player.cd=.4;player.flash=.07;player.act=.2;
  const cx=Math.cos(player.face),cy=Math.sin(player.face);
  bullets.push({x:player.x+cx*.35,y:player.y+cy*.35,vx:cx*18,vy:cy*18,life:.6,trail:[]});
  sfx("shot");
  alertNear(player.x,player.y,3.2,player.x,player.y);
}
function isBehind(g){return Math.abs(wrapA(Math.atan2(player.y-g.y,player.x-g.x)-g.face))>g.half+.25}
function meleeTarget(){
  let t=null,bd=1.7;
  for(const g of guards){if(g.down)continue;const d=Math.hypot(g.x-player.x,g.y-player.y);if(d<bd&&los(player.x,player.y,g.x,g.y)){bd=d;t=g}}
  return t;
}
// 射撃の自動照準：正面およそ100度以内で最も狙いやすい相手
function aimTarget(){
  let t=null,bs=1e9;
  const list=guards.filter(g=>!g.down).concat(cams.filter(c=>!c.dead));
  for(const o of list){
    const dx=o.x-player.x,dy=o.y-player.y,d=Math.hypot(dx,dy);
    if(d>8)continue;
    const ad=Math.abs(wrapA(Math.atan2(dy,dx)-player.face));
    if(ad>.9||!los(player.x,player.y,o.x,o.y))continue;
    const sc=ad*3+d*.15;if(sc<bs){bs=sc;t=o}
  }
  return t;
}
function downGuard(g){g.down=true;g.meter=0;g.path=[];kos++}
function updateBullets(dt){
  for(const b of bullets){
    const n=6;
    for(let i=0;i<n&&b.life>0;i++){
      b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;
      if(solidAt(b.x,b.y)){b.life=0;sparks.push({x:b.x-b.vx*.004,y:b.y-b.vy*.004,t:.25});sfx("spark");break}
      if(tank&&!tank.dead&&Math.hypot(tank.x-b.x,tank.y-b.y)<.95){b.life=0;sparks.push({x:b.x,y:b.y,t:.25});sfx("clang");toast("装甲に弾かれた。爆薬を使え");break}
      for(const g of guards)if(!g.down&&Math.hypot(g.x-b.x,g.y-b.y)<.32){downGuard(g);b.life=0;toast("見張りを倒した");break}
      for(const c of cams)if(!c.dead&&Math.hypot(c.x-b.x,c.y-b.y)<.32){c.dead=true;c.meter=0;b.life=0;sparks.push({x:c.x,y:c.y,t:.4});sfx("spark");toast("監視カメラを破壊した");break}
    }
    b.trail.push([b.x,b.y]);if(b.trail.length>4)b.trail.shift();
    b.life-=dt;
  }
  bullets=bullets.filter(b=>b.life>0);
  for(const s of sparks)s.t-=dt;sparks=sparks.filter(s=>s.t>0);
  for(const r of ripples)r.t+=dt;ripples=ripples.filter(r=>r.t<r.dur);
}

// ---------- 更新 ----------
function wrapA(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a}
function turn(o,want,rate,dt){const d=wrapA(want-o.face),s=rate*dt;o.face+=Math.max(-s,Math.min(s,d))}
function tryMove(dx,dy){
  // 角に引っかからないよう、通路の中心へ寄せる
  if(dx){
    if(free(player.x+dx,player.y))player.x+=dx;
    else{const c=Math.floor(player.y)+.5,off=c-player.y;
      if(Math.abs(off)>.01&&Math.abs(off)<.42&&free(player.x+dx,c))player.y+=Math.sign(off)*Math.min(Math.abs(off),Math.abs(dx)*1.2)}
  }
  if(dy){
    if(free(player.x,player.y+dy))player.y+=dy;
    else{const c=Math.floor(player.x)+.5,off=c-player.x;
      if(Math.abs(off)>.01&&Math.abs(off)<.42&&free(c,player.y+dy))player.x+=Math.sign(off)*Math.min(Math.abs(off),Math.abs(dy)*1.2)}
  }
}
function free(x,y){const r=.26;return !solidAt(x-r,y-r)&&!solidAt(x+r,y-r)&&!solidAt(x-r,y+r)&&!solidAt(x+r,y+r)}
function seesPoint(o,x,y,range,half){
  const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy);
  if(d>range)return 0;
  if(Math.abs(wrapA(Math.atan2(dy,dx)-o.face))>half)return 0;
  if(!los(o.x,o.y,x,y))return 0;
  return 1-d/range+0.0001;
}
// 暗がりの効果：止まっていれば、すぐそば以外からは見えない。動いていても見える距離は半分
function inShadow(){return darkAt(player.x,player.y)&&!L.nv}
function hiddenStill(){return inShadow()&&!player.moving}
function canSee(o,range,half){
  if(hiddenStill()&&Math.hypot(player.x-o.x,player.y-o.y)>1.6)return 0;
  return seesPoint(o,player.x,player.y,range*(inShadow()?.5:1),half)}
function investigate(g,x,y){
  const tx=Math.floor(x),ty=Math.floor(y);
  if(g.state!=="investigate"||!g.target||g.target[0]!==tx||g.target[1]!==ty||g.look>0){
    g.state="investigate";g.target=[tx,ty];g.look=0;
    g.path=bfs(Math.floor(g.x),Math.floor(g.y),tx,ty);
  }
}
function moveAlong(g,spd,dt){
  if(!g.path.length)return;
  const p=g.path[0],dx=p[0]-g.x,dy=p[1]-g.y,d=Math.hypot(dx,dy),s=spd*dt;
  g.want=Math.atan2(dy,dx);g.moving=true;
  const mv=Math.min(d,s);
  if(d<=s){g.x=p[0];g.y=p[1];g.path.shift()}else{g.x+=dx/d*s;g.y+=dy/d*s}
  g.walk+=mv;g.stepAcc=(g.stepAcc||0)+mv;
  if(g.stepAcc>=.62){g.stepAcc-=.62;
    const pd=Math.hypot(g.x-player.x,g.y-player.y);
    if(pd<7&&mode==="play"){const v=Math.pow(1-pd/7,1.6);if(v>.03)sfx("gstep",v,(g.x-player.x)/5)}}
}

function update(dt){
  time+=dt;clock+=dt;
  player.cd=Math.max(0,player.cd-dt);player.flash=Math.max(0,player.flash-dt);player.act=Math.max(0,player.act-dt);
  let ix=0,iy=0,m=0,sneak=sneakLock;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;
  if(ix||iy){const l=Math.hypot(ix,iy);ix/=l;iy/=l;m=1;if(keys.ShiftLeft||keys.ShiftRight)sneak=true}
  else if(stick.m>.15){ix=stick.x/stick.m;iy=stick.y/stick.m;m=1}
  player.sneak=sneak;player.moving=m>0;
  if(m>0){
    const sp=(sneak?1.65:2.6)*dt,ox=player.x,oy=player.y;
    tryMove(ix*sp,0);tryMove(0,iy*sp);
    const moved=Math.hypot(player.x-ox,player.y-oy);
    player.stepAcc=(player.stepAcc||0)+moved;
    const stride=sneak?.42:.58;
    if(player.stepAcc>=stride){
      player.stepAcc-=stride;
      if(sneak){sfx("sneakstep");ripples.push({x:player.x,y:player.y,max:.45,t:0,dur:.5,soft:true})}
      else{sfx("step");ripples.push({x:player.x,y:player.y,max:L.boss?.5:2.6,t:0,dur:.55,soft:false})}
    }
    player.face=Math.atan2(iy,ix);player.walk+=moved;
  }
  if(inShadow()&&!player.shadowTold){player.shadowTold=true;toast("暗がりに入った。止まっていれば、すぐそば以外からは見えない")}
  updateBullets(dt);
  const pc=cell(Math.floor(player.x),Math.floor(player.y));
  if(pc==="I"){
    const tx=Math.floor(player.x),ty=Math.floor(player.y),k=itemAt[tx+","+ty]||"doc";
    grid[ty][tx]=".";got++;intelTaken=got>=need;buildLayer();setObj();sfx("pick");
    toast(intelTaken?ITEMS[k].n+"を入手。すべて回収した。脱出地点へ向かえ":ITEMS[k].n+"を入手　残り "+(need-got));
  }
  if(pc==="B"){grid[Math.floor(player.y)][Math.floor(player.x)]=".";player.charges++;buildLayer();sfx("pick");toast("爆薬を入手　所持数 "+player.charges)}
  if(L.boss){updateBoss(dt);$("timer").textContent=fmt(time);return}
  if(pc==="E"){if(intelTaken){win();return}else if(toastT<=0)toast("まだ回収していない物がある　残り "+(need-got))}

  const noisy=player.moving&&!player.sneak;
  let seenNow=false,seenPct=0,heardNow=false;
  for(const g of guards){
    if(g.down)continue;
    g.moving=false;
    const dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy);
    if(d<.5){caught(g,"見張りに捕まった");return}
    const v=canSee(g,g.range,g.half);
    if(v>0){
      let r=(.5+1.1*v)*(L.det||1);if(player.sneak)r*=.75;if(inShadow())r*=.6;
      g.meter=Math.min(1,g.meter+r*dt);
      if(g.meter>.3)investigate(g,player.x,player.y);
      seenNow=true;seenPct=Math.max(seenPct,g.meter);
      if(!g.noticed){g.noticed=true;sfx("notice")}
    }else g.meter=Math.max(0,g.meter-.2*dt);
    if(g.meter>.6&&!g.alarmed){g.alarmed=true;sfx("alert")}else if(g.meter<.35)g.alarmed=false;
    if(g.meter<=0)g.noticed=false;
    // 倒れた仲間の発見
    for(const b of guards){
      if(!b.down||b.found)continue;
      if(seesPoint(g,b.x,b.y,g.range,g.half)>0){
        b.found=true;g.meter=Math.max(g.meter,.5);investigate(g,b.x,b.y);toast("倒れた見張りが仲間に見つかった");
      }
    }
    if(noisy&&d<2.6){
      if(g.state==="patrol"||g.look>0){investigate(g,player.x,player.y);g.heard=1.2;heardNow=true}
      g.meter=Math.min(1,g.meter+.12*dt);
    }
    if(d<1.1&&noisy)g.meter=Math.min(1,g.meter+1.2*dt);
    g.heard=Math.max(0,g.heard-dt);

    if(g.state==="patrol"){
      if(g.wait>0){
        g.wait-=dt;turn(g,g.lookBase+Math.sin(clock*1.6)*.75,2.2,dt);
      }else{
        if(!g.path.length){
          const w=g.wp[g.wi];
          if(Math.floor(g.x)===w[0]&&Math.floor(g.y)===w[1]){
            g.wait=g.wp.length>1?1.5:4;g.lookBase=g.face;g.wi=(g.wi+1)%g.wp.length;
          }else g.path=bfs(Math.floor(g.x),Math.floor(g.y),w[0],w[1]);
        }
        moveAlong(g,g.speed,dt);
        turn(g,g.want,5,dt);
      }
    }else{
      if(g.look>0){
        g.look-=dt;turn(g,g.lookBase+Math.sin(clock*2.2)*1.1,3,dt);
        if(g.look<=0){g.state="patrol";g.path=[];g.target=null}
      }else{
        moveAlong(g,g.speed*1.55,dt);
        if(v>0)turn(g,Math.atan2(dy,dx),6,dt);else turn(g,g.want,6,dt);
        if(!g.path.length){g.look=3.2;g.lookBase=g.face}
      }
    }
  }
  for(const c of cams){
    if(c.dead)continue;
    c.t+=dt;c.face=c.base+c.amp*Math.max(-1,Math.min(1,Math.sin(c.t*c.spd)*1.6));
    const v=canSee(c,c.range,c.half);
    if(v>0){
      c.meter=Math.min(1,c.meter+(.45+.8*v)*(L.det||1)*dt);
      seenNow=true;seenPct=Math.max(seenPct,c.meter);
      if(!c.noticed){c.noticed=true;sfx("notice")}
      if(c.meter>.25&&time-lastCall>1){
        if(time-lastCall>3)sfx("cam");
        lastCall=time;
        for(const g of guards)if(!g.down&&Math.hypot(g.x-c.x,g.y-c.y)<11)investigate(g,player.x,player.y);
        toast("監視カメラに映った");
      }
    }else c.meter=Math.max(0,c.meter-.22*dt);
    if(c.meter<=0)c.noticed=false;
  }
  let a=0;for(const g of guards)if(!g.down)a=Math.max(a,g.meter);for(const c of cams)if(!c.dead)a=Math.max(a,c.meter);
  maxAlert=Math.max(maxAlert,a);
  A.ten+=(a-A.ten)*Math.min(1,dt*3);
  const bar=$("alertbar");bar.style.width=(a*100).toFixed(1)+"%";bar.classList.toggle("hot",a>.6);
  if(a>=1){
    let by=null;for(const g of guards)if(!g.down&&g.meter>=1)by=g;for(const c of cams)if(!c.dead&&c.meter>=1)by=c;
    caught(by,by&&by.spd?"監視カメラに発見された":"発見された");return;
  }
  // 状況表示
  let msg="潜伏中",cls="";
  const searching=guards.some(g=>!g.down&&g.state==="investigate");
  if(seenNow){msg="見張りに見られている　警戒 "+Math.round(seenPct*100)+"%";cls=seenPct>.6?"hot":"warn"}
  else if(heardNow||guards.some(g=>!g.down&&g.heard>0)){msg="足音を聞かれた";cls="warn"}
  else if(searching){msg="見張りが辺りを捜索中";cls="warn"}
  else if(hiddenStill()){msg="暗がりで静止中　すぐそばの見張り以外には見えない";cls="safe"}
  else if(inShadow()){msg=player.sneak?"暗がりを忍び足で移動中　見える距離は半分":"暗がりを歩行中　見える距離は半分　足音は出ている";cls=player.sneak?"safe":"warn"}
  else if(darkAt(player.x,player.y)&&L.nv){msg="暗視装置のため、暗がりでも普通に見える";cls="warn"}
  else if(player.moving&&!player.sneak){
    const near=guards.some(g=>!g.down&&Math.hypot(g.x-player.x,g.y-player.y)<4);
    msg="歩行中　足音が出ている";cls=near?"warn":""}
  else if(player.moving&&player.sneak){msg="忍び足で移動中　足音なし"}
  setStatus(msg,cls);
  $("wrap").classList.toggle("seen",seenNow);player.seen=seenNow;
  // 武器の候補
  player.mt=meleeTarget();player.at=player.ammo>0?aimTarget():null;
  const mb=$("meleeBtn"),ml=$("meleeLbl");
  if(player.mt){const b=isBehind(player.mt);mb.classList.toggle("ready",b||player.mt.meter<=.85);ml.textContent=b?"無音":(player.mt.meter>.85?"できない":"音が出る")}
  else{mb.classList.remove("ready");ml.textContent="近づいて使う"}
  $("timer").textContent=fmt(time);
}
// ================= 戦車戦 =================
function hurt(why){
  if(player.inv>0||mode!=="play")return;
  player.hp--;player.inv=1.6;hitFlash=.45;shake=Math.max(shake,.35);sfx("hit");
  if(player.hp<=0){caught(tank,why);return}
  toast(why+"　残り体力 "+player.hp);
}
function explode(x,y,r,power){
  booms.push({x,y,r,t:0,dur:.7});shake=Math.max(shake,.25*power+.15);sfx("boom",power);
  if(Math.hypot(player.x-x,player.y-y)<r)hurt("爆風に巻き込まれた");
  let broke=false;
  for(let ty=Math.floor(y-r);ty<=Math.floor(y+r);ty++)for(let tx=Math.floor(x-r);tx<=Math.floor(x+r);tx++){
    if(cell(tx,ty)==="C"&&Math.hypot(tx+.5-x,ty+.5-y)<r+.3){grid[ty][tx]=".";broke=true;for(let i=0;i<3;i++)sparks.push({x:tx+.5,y:ty+.5,t:.4})}
  }
  if(broke)buildLayer();
}
// 巨大戦車の寸法（マス単位）。描画は TS 倍に拡大
const TS=2.05,HL=.95*TS,HW=.74*TS,BARREL=1.4*TS;
function tankLocal(px,py){const tk=tank,c=Math.cos(-tk.hull),s=Math.sin(-tk.hull),dx=px-tk.x,dy=py-tk.y;return [dx*c-dy*s,dx*s+dy*c]}
function tankWorld(lx,ly){const tk=tank,c=Math.cos(tk.hull),s=Math.sin(tk.hull);return [tk.x+lx*c-ly*s,tk.y+lx*s+ly*c]}
function hullDist(px,py){const [lx,ly]=tankLocal(px,py);const ex=Math.max(0,Math.abs(lx)-HL),ey=Math.max(0,Math.abs(ly)-HW);return Math.hypot(ex,ey)}
function phase(){return tank.hp>=3?1:tank.hp===2?2:3}
// 主砲は照準が終わると着弾地点を地面に示し、少し間をおいてからその地点へ撃つ。走れば避けられる
function fire(tx,ty){
  const tk=tank,bx=tk.x+Math.cos(tk.tur)*BARREL,by=tk.y+Math.sin(tk.tur)*BARREL;
  const d=Math.hypot(tx-bx,ty-by)||1,sp=phase()===1?8:9;
  shells.push({x:bx,y:by,tx,ty,vx:(tx-bx)/d,vy:(ty-by)/d,sp,left:d,r:1.05});
  tk.flash=.14;shake=Math.max(shake,.3);sfx("cannon");
}
function mgFire(tx,ty){
  const tk=tank,[mx,my]=tankWorld(-.55*TS,0);
  const a0=Math.atan2(ty-my,tx-mx);
  for(let i=0;i<5;i++)mgShots.push({x:mx,y:my,a:a0+(Math.random()-.5)*.14,delay:i*.09,life:.9,trail:[]});
  tk.mgFlash=.5;
}
function plant(){
  const tk=tank;if(!tk||tk.dead)return;
  if(player.charges<=0){toast("爆薬を持っていない。演習場の爆薬を拾え");sfx("empty");player.cd=.3;return}
  if(hullDist(player.x,player.y)>.85){toast("戦車の車体にもっと近づけ");sfx("empty");player.cd=.3;return}
  let [lx,ly]=tankLocal(player.x,player.y);
  lx=Math.max(-HL*.9,Math.min(HL*.9,lx));ly=Math.max(-HW*.85,Math.min(HW*.85,ly));
  charges.push({lx,ly,fuse:3,beep:0});player.charges--;player.cd=.5;player.act=.3;
  sfx("plant");toast("爆薬を仕掛けた。三秒後に爆発する。離れろ");
}
function updateBoss(dt){
  const tk=tank;
  player.inv=Math.max(0,player.inv-dt);
  updateFx(dt);
  if(tk.dead){
    tk.deadT+=dt;
    if(tk.booms<8&&tk.deadT>tk.booms*.3){tk.booms++;const [ex,ey]=tankWorld((Math.random()-.5)*HL*1.6,(Math.random()-.5)*HW*1.6);explodeFx(ex,ey,2.2)}
    engineSet(0,0);
    if(tk.deadT>3.2)win();
    return;
  }
  const ph=phase();
  // 車体の移動：経路を周回し、角では止まって旋回する。段階が進むほど速い
  tk.vx=tk.vy=0;
  if(tk.pause>0)tk.pause-=dt;
  else{
    const R=L.tank.route,w=R[tk.ri],dx=w[0]-tk.x,dy=w[1]-tk.y,d=Math.hypot(dx,dy);
    const diff=wrapA(Math.atan2(dy,dx)-tk.hull);
    if(Math.abs(diff)>.04){tk.hull+=Math.sign(diff)*Math.min(Math.abs(diff),(ph===3?1.6:1.2)*dt);tk.tread+=dt*.6}
    else{
      const sp=[0,1.05,1.35,1.65][ph]*dt;
      if(d<=sp){tk.x=w[0];tk.y=w[1];tk.pause=ph===3?.3:.6;
        // 第二段階からは逆回りに切り替わることがある
        if(ph>=2&&Math.random()<.35){tk.dir=-(tk.dir||1)}
        tk.ri=(tk.ri+(tk.dir||1)+R.length)%R.length}
      else{tk.x+=dx/d*sp;tk.y+=dy/d*sp;tk.vx=dx/d;tk.vy=dy/d;tk.tread+=sp}
    }
  }
  // 巨体が乗り上げた木箱やブロックは押しつぶされる
  {let broke=false;const rr=Math.hypot(HL,HW);
    for(let ty=Math.floor(tk.y-rr);ty<=Math.floor(tk.y+rr);ty++)for(let tx=Math.floor(tk.x-rr);tx<=Math.floor(tk.x+rr);tx++){
      if(cell(tx,ty)!=="C")continue;const [lx,ly]=tankLocal(tx+.5,ty+.5);
      if(Math.abs(lx)<HL+.35&&Math.abs(ly)<HW+.35){grid[ty][tx]=".";broke=true;for(let i=0;i<4;i++)sparks.push({x:tx+.5,y:ty+.5,t:.4});shake=Math.max(shake,.2)}}
    if(broke){buildLayer();sfx("clang")}}
  // 主砲の照明
  const lockT=[0,1,.8,.62][ph],range=9*(darkAt(player.x,player.y)?.5:1);
  const v=seesPoint({x:tk.x,y:tk.y,face:tk.tur},player.x,player.y,range,.47);
  const pd=Math.hypot(player.x-tk.x,player.y-tk.y);
  const noisy=player.moving&&!player.sneak;
  const tur={get face(){return tk.tur},set face(a){tk.tur=a}};
  if(v>0){
    if(!tk.seen)sfx("notice");
    tk.seen=true;tk.noise=null;
    turn(tur,Math.atan2(player.y-tk.y,player.x-tk.x),[0,1.7,2.2,2.8][ph],dt);
    tk.lock=Math.min(1,tk.lock+dt/lockT);
    tk.beepT-=dt;if(tk.beepT<=0){sfx("lock");tk.beepT=.32-tk.lock*.22}
  }else{
    tk.seen=false;tk.lock=Math.max(0,tk.lock-dt*.6);
    if(tk.noise){turn(tur,Math.atan2(tk.noise[1]-tk.y,tk.noise[0]-tk.x),1.8,dt);tk.noiseT-=dt;if(tk.noiseT<=0)tk.noise=null}
    else{tk.sweep+=dt;turn(tur,tk.hull+Math.sin(tk.sweep*.9)*1.4,1.3,dt)}
  }
  tk.cd-=dt;tk.flash=Math.max(0,(tk.flash||0)-dt);
  if(tk.aim){
    tk.aim.t+=dt;turn(tur,Math.atan2(tk.aim.y-tk.y,tk.aim.x-tk.x),3,dt);
    if(tk.aim.t>=tk.aim.dur){fire(tk.aim.x,tk.aim.y);tk.aim=null;tk.lock=.3;tk.cd=[0,2.4,2,1.7][ph]}

function drawWall(g,x,y,s){
  const T=TH,px=x*s,py=y*s,r=hsh(x,y,3);
  g.fillStyle=T.wc;g.fillRect(px,py,s+.5,s+.5);
  g.save();g.beginPath();g.rect(px,py,s,s);g.clip();
  const lw=Math.max(1,dpr*.8);g.lineWidth=lw;
  switch(T.wall){
    case "brick":case "sewerbrick":{
      g.strokeStyle=shade(T.wc,-.35);const bh=s/3;
      for(let i=0;i<3;i++){const yy=py+i*bh;g.beginPath();g.moveTo(px,yy);g.lineTo(px+s,yy);g.stroke();
        const o=((y*3+i)%2)*s/4;for(let k=o;k<s;k+=s/2){g.beginPath();g.moveTo(px+k,yy);g.lineTo(px+k,yy+bh);g.stroke()}}
      if(T.wall==="sewerbrick"&&r>.6){g.fillStyle="rgba(90,140,70,.35)";g.fillRect(px,py+s*.6,s,s*.4)}
      break;}
    case "corrugated":
      for(let k=0;k<s;k+=s/6){g.fillStyle=(k/(s/6))%2<1?shade(T.wc,.12):shade(T.wc,-.12);g.fillRect(px+k,py,s/6+.5,s)}break;
    case "panelwood":
      g.strokeStyle=shade(T.wc,-.3);for(let k=0;k<s;k+=s/4){g.beginPath();g.moveTo(px+k,py);g.lineTo(px+k,py+s);g.stroke()}break;
    case "panel":
      g.strokeStyle=shade(T.wc,-.2);g.strokeRect(px+s*.08,py+s*.08,s*.84,s*.84);break;
    case "concrete":
      g.strokeStyle=shade(T.wc,-.25);g.strokeRect(px+.5,py+.5,s-1,s-1);g.fillStyle="rgba(0,0,0,.25)";g.fillRect(px+s*.45,py+s*.45,s*.1,s*.1);break;
    case "rock":
      for(let i=0;i<3;i++){g.fillStyle=i%2?shade(T.wc,.15):shade(T.wc,-.2);g.beginPath();g.ellipse(px+s*hsh(x,y,i),py+s*hsh(x,y,i+4),s*.35,s*.25,hsh(x,y,i+8)*3,0,Math.PI*2);g.fill()}break;
    case "stone":
      g.strokeStyle=shade(T.wc,-.35);g.lineWidth=lw*1.2;const o=(y%2)*s/2;g.beginPath();g.moveTo(px,py+s/2);g.lineTo(px+s,py+s/2);g.moveTo(px+o,py);g.lineTo(px+o,py+s/2);g.moveTo(px+(o+s/2)%s,py+s/2);g.lineTo(px+(o+s/2)%s,py+s);g.stroke();break;
  }
  g.restore();
  // 上面の縁（明るい側）と輪郭
  const open=(xx,yy)=>cell(xx,yy)!=="#";
  g.lineWidth=Math.max(1.5,dpr*1.4);
  g.strokeStyle=T.wt;g.beginPath();
  if(open(x,y-1)){g.moveTo(px,py+1);g.lineTo(px+s,py+1)}
  if(open(x-1,y)){g.moveTo(px+1,py);g.lineTo(px+1,py+s)}
  g.stroke();
  g.strokeStyle=shade(T.wc,-.5);g.beginPath();
  if(open(x,y+1)){g.moveTo(px,py+s-1);g.lineTo(px+s,py+s-1)}
  if(open(x+1,y)){g.moveTo(px+s-1,py);g.lineTo(px+s-1,py+s)}
  g.stroke();
}
function drawObstacle(g,x,y,s){

      g.fillStyle=shade(col,.22);g.fillRect(x0,y0,x1-x0,s*.08);
      g.strokeStyle=shade(col,-.5);g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y0);g.moveTo(x0,y1);g.lineTo(x1,y1);if(!nL){g.moveTo(x0,y0);g.lineTo(x0,y1)}if(!nR){g.moveTo(x1,y0);g.lineTo(x1,y1)}g.stroke();
      if(T.ob==="wagon"&&!nR){g.fillStyle="#222";g.fillRect(x1-s*.05,py+s*.4,s*.1,s*.2)}

    case "desk":{

      g.fillStyle="#f2ecdc";g.save();g.translate(px+s*.35,py+s*.4);g.rotate(hsh(x,y)-.5);g.fillRect(-s*.14,-s*.18,s*.28,s*.36);g.restore();
      if(hsh(x,y,2)>.5){g.fillStyle="#22262a";g.fillRect(px+s*.55,py+s*.15,s*.3,s*.2);g.fillStyle="#6fd0ff";g.fillRect(px+s*.58,py+s*.18,s*.24,s*.12)}
      break;}
    case "bench":{
      const m=s*.06;g.fillStyle=col;g.fillRect(px+m,py+m,s-2*m,s-2*m);g.strokeStyle="#7f9aa3";g.strokeRect(px+m,py+m,s-2*m,s-2*m);
      const cols=["#4fd1c5","#e2a23a","#c25bd6","#8bd14f"];
      for(let i=0;i<3;i++){g.fillStyle=cols[Math.floor(hsh(x,y,i)*4)];g.beginPath();g.arc(px+s*(.25+.25*i),py+s*(.35+.3*hsh(x,y,i+3)),s*.08,0,Math.PI*2);g.fill()}
      break;}
    case "rock":{
      g.fillStyle=shade(col,-.2);g.beginPath();g.ellipse(px+s*.52,py+s*.56,s*.46,s*.4,hsh(x,y),0,Math.PI*2);g.fill();
      g.fillStyle=col;g.beginPath();g.ellipse(px+s*.46,py+s*.46,s*.4,s*.34,hsh(x,y),0,Math.PI*2);g.fill();
      g.fillStyle="#f4f7f9";g.beginPath();g.ellipse(px+s*.4,py+s*.34,s*.26,s*.14,0,0,Math.PI*2);g.fill();break;}
    case "pipe":{
      g.fillStyle=shade(col,-.2);g.fillRect(px,py+s*.2,s,s*.6);g.fillStyle=col;g.fillRect(px,py+s*.25,s,s*.3);g.fillStyle=shade(col,.3);g.fillRect(px,py+s*.28,s,s*.06);break;}
    case "sandbag":case "block":{
      if(T.ob==="block"){g.fillStyle=col;g.fillRect(px+s*.05,py+s*.05,s*.9,s*.9);g.fillStyle=shade(col,.25);g.fillRect(px+s*.05,py+s*.05,s*.9,s*.12);g.strokeStyle=shade(col,-.4);g.strokeRect(px+s*.05,py+s*.05,s*.9,s*.9);
        g.strokeStyle="rgba(0,0,0,.25)";g.beginPath();g.moveTo(px+s*.2,py+s*.6);g.lineTo(px+s*.45,py+s*.75);g.stroke();break}
      for(let r=0;r<3;r++)for(let k=0;k<2;k++){const bx=px+s*(.04+k*.48+(r%2)*.12),by=py+s*(.06+r*.3);if(bx+s*.44>px+s*1.02)continue;
        g.fillStyle=shade(col,(r+k)%2?-.08:.06);g.beginPath();g.ellipse(bx+s*.22,by+s*.13,s*.22,s*.13,0,0,Math.PI*2);g.fill();g.strokeStyle=shade(col,-.4);g.stroke()}

function buildLayer(){
  layer=document.createElement("canvas");layer.width=Math.ceil(W*tile*dpr);layer.height=Math.ceil(H*tile*dpr);
  const g=layer.getContext("2d");const s=tile*dpr;
  drawFloor(g,s);drawDark(g,s);drawWallShadows(g,s);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c==="#")drawWall(g,x,y,s);else if(c==="C")drawObstacle(g,x,y,s)}
  // 全体を薄暗く沈める。人物と視界の扇を浮かび上がらせるため
  g.fillStyle=TH.bright?"rgba(8,12,24,.58)":"rgba(6,8,16,.5)";g.fillRect(0,0,layer.width,layer.height);
  const vg=g.createRadialGradient(layer.width/2,layer.height/2,Math.min(layer.width,layer.height)*.35,layer.width/2,layer.height/2,Math.max(layer.width,layer.height)*.75);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.35)");g.fillStyle=vg;g.fillRect(0,0,layer.width,layer.height);
  drawDarkEdges(g,s);
  drawLights(g,s);
}
// 暗がりの範囲を青みのある縁取りと斜線で示す
function drawDarkEdges(g,s){
  if(L.nv)return;
  g.save();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]!=="D")continue;const px=x*s,py=y*s;
    g.save();g.beginPath();g.rect(px,py,s,s);g.clip();
    g.strokeStyle="rgba(120,140,230,.13)";g.lineWidth=Math.max(1,dpr*.8);g.beginPath();
    for(let k=-s;k<s;k+=s/4){g.moveTo(px+k,py+s);g.lineTo(px+k+s,py)}g.stroke();g.restore();
    g.strokeStyle="rgba(140,160,255,.45)";g.lineWidth=Math.max(1,dpr*1.1);g.setLineDash([s*.18,s*.12]);g.beginPath();
    const open=(xx,yy)=>{const c=cell(xx,yy);return c!=="D"&&c!=="#"&&c!=="C"};
    if(open(x,y-1)){g.moveTo(px,py);g.lineTo(px+s,py)}
    if(open(x,y+1)){g.moveTo(px,py+s);g.lineTo(px+s,py+s)}
    if(open(x-1,y)){g.moveTo(px,py);g.lineTo(px,py+s)}
    if(open(x+1,y)){g.moveTo(px+s,py);g.lineTo(px+s,py+s)}
    g.stroke();g.setLineDash([]);
  }
  g.restore();
}
// 天候・環境の演出（毎フレーム）
const FX={p:[]};
function drawAmbient(dt){
  const kind=TH.fx;if(kind==="none")return;
  const P=FX.p;
  const rx=()=>camX+Math.random()*VW,ry=()=>camY+Math.random()*VH,R=camX+VW,B=camY+VH;
  for(const p of P)if(p.x<camX-2||p.x>R+2||p.y<camY-2||p.y>B+2){p.x=rx();p.y=ry()}
  if(kind==="rain"){
    while(P.length<120)P.push({x:rx(),y:ry(),v:14+Math.random()*6});
    ctx.strokeStyle="rgba(170,205,230,.35)";ctx.lineWidth=.025;ctx.beginPath();
    for(const p of P){p.y+=p.v*dt;p.x+=p.v*.15*dt;if(p.y>B){p.y=camY-.5;p.x=rx()}ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-.06,p.y-.4)}
    ctx.stroke();
    if(Math.random()<dt*1.5){const x=rx(),y=ry();ripples.push({x,y,max:.35,t:0,dur:.4,soft:true})}
  }else if(kind==="snow"){
    while(P.length<90)P.push({x:rx(),y:ry(),v:.6+Math.random()*.8,ph:Math.random()*6});
    ctx.fillStyle="rgba(255,255,255,.85)";
    for(const p of P){p.y+=p.v*dt;p.x+=Math.sin(clock+p.ph)*.4*dt+.25*dt;if(p.y>B){p.y=camY-.2;p.x=rx()}if(p.x>R)p.x=camX;ctx.fillRect(p.x,p.y,.07,.07)}
  }else if(kind==="dust"||kind==="dust2"){
    while(P.length<(kind==="dust"?40:30))P.push({x:rx(),y:ry(),ph:Math.random()*6,r:kind==="dust"?.04:.6+Math.random()});
    for(const p of P){p.x+=(.15+Math.sin(clock*.3+p.ph)*.1)*dt*(kind==="dust"?1:3);p.y+=Math.cos(clock*.4+p.ph)*.08*dt;if(p.x>R+1)p.x=camX-1;
      if(kind==="dust"){ctx.fillStyle=`rgba(255,235,190,${.25+.2*Math.sin(clock*2+p.ph)})`;ctx.fillRect(p.x,p.y,p.r,p.r)}
      else{ctx.fillStyle="rgba(200,170,120,.06)";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}}
  }else if(kind==="steam"){
    while(P.length<14)P.push({x:rx(),y:ry(),t:Math.random()*4});
    for(const p of P){p.t+=dt;p.x+=.3*dt;p.y-=.15*dt;if(p.t>4){p.t=0;p.x=rx();p.y=ry()}
      const k=p.t/4;ctx.fillStyle=`rgba(235,235,230,${.12*(1-k)})`;ctx.beginPath();ctx.arc(p.x,p.y,.3+k*1.2,0,Math.PI*2);ctx.fill()}
  }else if(kind==="drips"){
    if(Math.random()<dt*4){const x=Math.floor(rx()),y=Math.floor(ry());if(cell(x,y)==="D")ripples.push({x:x+Math.random(),y:y+Math.random(),max:.5,t:0,dur:.7,soft:true})}
    const gr=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,5);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(0,10,8,.45)");ctx.fillStyle=gr;ctx.fillRect(camX,camY,VW,VH);
  }else if(kind==="flicker"){
    const f=Math.sin(clock*37)>.97?.08:0;if(f){ctx.fillStyle=`rgba(0,20,30,${f})`;ctx.fillRect(camX,camY,VW,VH)}
  }else if(kind==="embers"){
    while(P.length<30)P.push({x:rx(),y:ry(),v:.4+Math.random()*.6,ph:Math.random()*6});
    for(const p of P){p.y-=p.v*dt;p.x+=Math.sin(clock*2+p.ph)*.3*dt;if(p.y<camY){p.y=B;p.x=rx()}ctx.fillStyle=`rgba(255,${140+(p.ph*20|0)},60,${.5+.4*Math.sin(clock*5+p.ph)})`;ctx.fillRect(p.x,p.y,.06,.06)}
  }
}
function cone(o,range,half,col){
  const N=36;ctx.beginPath();ctx.moveTo(o.x,o.y);
  for(let i=0;i<=N;i++){
    const a=o.face-half+2*half*i/N,cx=Math.cos(a),cy=Math.sin(a);let r=0;
    while(r<range){r+=.09;if(solidAt(o.x+cx*r,o.y+cy*r)){r-=.05;break}}
    ctx.lineTo(o.x+cx*r,o.y+cy*r);
  }
  ctx.closePath();
  const gr=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,range);
  const bf=TH.bright?1.6:1;
  if(inShadow()&&!o.isTank){
    // 暗がりにいる間は、扇の手前半分だけが「見える範囲」。止まっていれば扇全体が薄くなる
    const still=hiddenStill(),k=still?.35:1;
    gr.addColorStop(0,col.replace("A",(0.34*bf*k).toFixed(2)));gr.addColorStop(.48,col.replace("A",(0.22*bf*k).toFixed(2)));
    gr.addColorStop(.52,col.replace("A","0.03"));gr.addColorStop(1,col.replace("A","0.02"));
  }else{gr.addColorStop(0,col.replace("A",(0.34*bf).toFixed(2)));gr.addColorStop(1,col.replace("A",(0.06*bf).toFixed(2)))}
  ctx.fillStyle=gr;ctx.fill();
  ctx.strokeStyle=col.replace("A",TH.bright?"0.7":"0.35");ctx.lineWidth=TH.bright?.045:.03;ctx.stroke();
  // 暗所にいるときに気づかれる距離（視界の半分）
  ctx.save();ctx.clip();
  const inDark=inShadow();
  ctx.strokeStyle=col.replace("A",inDark?"0.75":"0.28");ctx.lineWidth=inDark?.05:.03;ctx.setLineDash([.12,.12]);
  ctx.beginPath();ctx.arc(o.x,o.y,range/2,o.face-half,o.face+half);ctx.stroke();ctx.restore();
}

  const sc=(big?1.5:1)*pop*(big?1+.08*Math.sin(clock*14):1);
  const r=.32*sc,red=m==="!";

  g.fillStyle="#0a0807";g.beginPath();g.moveTo(w*.42,h);
  g.lineTo(w*.5,h*.86);g.lineTo(w*.58,h*.84);g.lineTo(w*.66,h*.8);g.lineTo(w*.8,h*.79);g.lineTo(w*.9,h*.82);g.lineTo(w,h*.8);g.lineTo(w,h);g.closePath();g.fill();
  // 工作員の立ち姿
  const fh=Math.min(h*.5,w*.75),bx=w*.73,by=h*.795;
  drawOperative(g,bx,by,fh,t);
  // 周辺減光と映画の帯
  const vg=g.createRadialGradient(w*.5,h*.5,Math.min(w,h)*.3,w*.5,h*.5,Math.max(w,h)*.8);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.6)");
  g.fillStyle=vg;g.fillRect(0,0,w,h);
  const bar=Math.min(h*.07,40)*Math.min(1,t/1.2);g.fillStyle="#000";g.fillRect(0,0,w,bar);g.fillRect(0,h-bar,w,bar);
  // 暗転からの立ち上がり
  if(t<2.2){g.fillStyle=`rgba(0,0,0,${1-t/2.2})`;g.fillRect(0,0,w,h)}
  END.raf=requestAnimationFrame(endPaint);
}
function drawOperative(g,x,y,H,t){
  // 横向き（左を向く）。足元が(x,y)、身長H
  const u=H/100;g.save();g.translate(x,y);g.shadowColor="rgba(255,170,90,.55)";g.shadowBlur=6*u/3;g.shadowOffsetX=-.6*u;g.fillStyle="#070605";g.strokeStyle="#070605";g.lineCap="round";g.lineJoin="round";
  const sway=Math.sin(t*.8)*.6;
  // 脚
  g.beginPath();g.moveTo(-6*u,-50*u);g.lineTo(-11*u,-26*u);g.lineTo(-13*u,-3*u);g.lineTo(-20*u,-1*u);g.lineTo(-21*u,1*u);g.lineTo(-7*u,1*u);g.lineTo(-6*u,-25*u);g.lineTo(0,-48*u);g.closePath();g.fill();
  g.beginPath();g.moveTo(-2*u,-50*u);g.lineTo(4*u,-27*u);g.lineTo(5*u,-3*u);g.lineTo(-2*u,-1*u);g.lineTo(-3*u,1*u);g.lineTo(11*u,1*u);g.lineTo(10*u,-4*u);g.lineTo(10*u,-27*u);g.lineTo(6*u,-50*u);g.closePath();g.fill();
  // 胴（装備ベスト）
  g.beginPath();g.moveTo(-9*u,-52*u);g.lineTo(-10*u,-70*u);g.quadraticCurveTo(-9*u,-80*u,-3*u,-82*u);g.lineTo(6*u,-82*u);g.quadraticCurveTo(10*u,-78*u,9*u,-68*u);g.lineTo(8*u,-52*u);g.closePath();g.fill();
  // 背嚢
  g.beginPath();g.moveTo(8*u,-80*u);g.lineTo(17*u,-78*u);g.quadraticCurveTo(20*u,-70*u,18*u,-56*u);g.lineTo(9*u,-55*u);g.closePath();g.fill();
  g.fillRect(9*u,-84*u,6*u,4*u);
  // アンテナ
  g.lineWidth=.7*u;g.beginPath();g.moveTo(14*u,-83*u);g.lineTo(17*u+sway*u,-104*u);g.stroke();
  // 首と頭（帽子）
  g.beginPath();g.moveTo(-2*u,-82*u);g.lineTo(-2*u,-86*u);g.lineTo(3*u,-86*u);g.lineTo(3*u,-82*u);g.fill();
  g.beginPath();g.ellipse(0,-92*u,6.2*u,7*u,0,0,Math.PI*2);g.fill();
  g.beginPath();g.moveTo(-6.5*u,-95*u);g.quadraticCurveTo(0,-103*u,7*u,-96*u);g.lineTo(7*u,-93*u);g.lineTo(-11*u,-94*u);g.closePath();g.fill();
  // 鼻と顎の輪郭（左向き）
  g.beginPath();g.moveTo(-6*u,-92*u);g.lineTo(-8*u,-89.5*u);g.lineTo(-6*u,-88.5*u);g.lineTo(-5*u,-86*u);g.lineTo(-1*u,-85*u);g.closePath();g.fill();
  // 腕：手前の腕は下ろして拳銃を持つ
  g.lineWidth=5*u;g.beginPath();g.moveTo(-3*u,-78*u);g.lineTo(-7*u,-62*u);g.lineTo(-6*u,-50*u);g.stroke();
  g.lineWidth=2.6*u;g.beginPath();g.moveTo(-6*u,-49*u);g.lineTo(-7*u,-42*u);g.stroke();
  g.fillRect(-9.5*u,-43*u,4*u,9*u);
  // 奥の腕
  g.lineWidth=4.4*u;g.beginPath();g.moveTo(4*u,-77*u);g.lineTo(7*u,-62*u);g.lineTo(5*u,-52*u);g.stroke();
  // 腿のホルスター
  g.fillRect(-10*u,-46*u,5*u,9*u);
  // 外套の裾が風になびく
  g.beginPath();g.moveTo(8*u,-60*u);g.quadraticCurveTo(16*u+sway*2*u,-54*u,18*u+sway*3*u,-44*u);g.lineTo(9*u,-50*u);g.closePath();g.fill();
  g.restore();
}
function showEnding(){
  const e=$("ending");e.hidden=false;e.classList.remove("on");$("endroll").hidden=true;$("endtxt").hidden=false;
  const nb=$("endNext");nb.classList.remove("on");nb.textContent="作戦記録へ";
  mode="ending";engineOff();END.t0=performance.now();END.embers=[];END.stage=0;
  playSong("ending");
  cancelAnimationFrame(END.raf);END.raf=requestAnimationFrame(endPaint);
  setTimeout(()=>{if(mode==="ending")e.classList.add("on")},1800);
  setTimeout(()=>{if(mode==="ending")nb.classList.add("on")},5200);
}
function showRoll(){
  const roll=$("endroll");$("endtxt").hidden=true;$("endNext").classList.remove("on");
  let tot=0;const rows=LEVELS.map((l,i)=>{const b=best[i];if(b)tot+=b.time;return `<tr><td>${String(i+1).padStart(2,"0")}</td><td>${l.name}</td><td>${b?fmt(b.time):"--:--.-"}</td><td>${b?RANKS[b.rank]:"―"}</td></tr>`}).join("");
  const ghosts=LEVELS.filter((l,i)=>best[i]&&best[i].rank===3).length;
  roll.innerHTML=`<div class="card"><div class="eyebrow">これまでの記録</div><div class="big">潜入工作員</div>
    <table class="rolltbl"><tbody>${rows}</tbody></table>
    <div class="facts"><div><small>合計時間</small><b>${fmt(tot)}</b></div><div><small>最高評価の数</small><b>${ghosts}/10</b></div></div>
    <p>${ghosts===10?"十の作戦すべてを、痕跡ひとつ残さずに終えた。伝説の工作員と呼ぶにふさわしい。":"まだ痕跡を残した作戦がある。すべての作戦で「伝説の工作員」の評価を目指してみよう。"}</p>
    <div class="row"><button class="btn" id="endBack" type="button">作戦選択へ</button><button class="btn ghost" id="endAgain" type="button">もう一度見る</button></div></div>`;
  roll.hidden=false;
  $("endBack").onclick=closeEnding;$("endAgain").onclick=showEnding;
  if(!coarse)$("endBack").focus();
}
function closeEnding(){cancelAnimationFrame(END.raf);$("ending").hidden=true;title()}
$("endNext").addEventListener("click",showRoll);
function winBoss(){
  let r=player.hp>=3&&time<=L.par?3:player.hp>=2?2:player.hp>=1?1:0;
  const prev=best[levelIdx];
  if(!prev||r>prev.rank||(r===prev.rank&&time<prev.time)){best[levelIdx]={rank:r,time};saveBest()}
  setStatus("巨大戦車撃破","");
  if(!prev){setTimeout(()=>{if(mode==="win")showEnding()},2400)}
  show(`<div class="card"><div class="eyebrow">${L.code}　完了</div><div class="big green">巨大戦車撃破</div>
    <div class="facts"><div><small>所要時間</small><b>${fmt(time)}</b></div><div><small>残り体力</small><b>${player.hp}</b></div><div><small>評価</small><b class="rank">${RANKS[r]}</b></div></div>
    <p>巨大戦車は炎に包まれ、ついに動きを止めた。これで十の作戦はすべて終わった。</p><p style="font-size:12px;color:var(--dim)">最高評価の「伝説の工作員」は、体力を一度も減らさずに基準時間内に撃破すると得られる。</p>
    <div class="row"><button class="btn" id="ed" type="button">エンディングへ</button><button class="btn ghost" id="rs" type="button">もう一度</button><button class="btn ghost" id="back" type="button">作戦選択</button></div></div>`);
  $("ed").onclick=showEnding;$("rs").onclick=retry;$("back").onclick=title;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==="play")update(dt);
  else{clock+=dt;if(mode==="caught"){if(L&&L.boss)updateFx(dt);caughtT-=dt;if(caughtT<=0)fail(caughtWhy)}}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove("on")}
  draw();
  requestAnimationFrame(frame);
}
resize();
load(0);
title();
requestAnimationFrame(frame);
})();
